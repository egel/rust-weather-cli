[package]
name = "rust-weather-cli"
version = "0.1.0"
edition = "2021"
description = "A keyboard-first terminal weather dashboard powered by Open-Meteo (no API key required)"
license-file = "LICENSE"

[dependencies]
anyhow = "1"
chrono = "0.4"
crossterm = "0.28"
dirs = "6"
ratatui = "0.29"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
